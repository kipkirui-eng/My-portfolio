<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h2 class="logo">My Portfolio</h2>
        <button class="menu-toggle"
    onclick="toggleMenu()">☰</button>
        <nav id="nav-menu">
            <a href="Home.html">Home</a>
            <a href="About.html">About</a>
            <a href="Skills.html">Skills</a>
            <a href="Projects.html">Projects</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </header>
    <section class="contact-section">
        <h1>Contact Me</h1>
        <p>
            Have a project, opportunity or question?. Feel free to get in touch with me.
        </p>
        <div class="contact-container">
            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p>Email: kipkiruim89@gmail.com</p>
                <p>Location: Kenya</p>
                <p>Profession: Software Developer</p>
            </div>
            <form class="contact-form"
            action="http://formsubmit.co/kipkiruim89@gmail.com"
            method="POST">
                
                <input type="hidden" name="_subject" value="New Message from My Portfolio">
                <input type="hidden" name="_captcha" value="true">
                <input type="hidden" name="_template" value="table">

                <input type="text"
                placeholder="Your Name" required>
                <input type="email"
                placeholder="Your Email" required>
                <input type="text"
                placeholder="Subject" required>

                <textarea placeholder="Your Message" rows="6" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </section>
    <script src="script.js"></script>
</body>
</html>
